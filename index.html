<!DOCTYPE html>
<!--
  AlexisOS // Cogitator Terminal
  Personal portfolio of Alexis Gonzalez, presented as a terminal on a
  derelict ship. Plain HTML, CSS, and JavaScript. No frameworks.

  FILES
  - index.html  : the terminal shell (status bar, screen, prompt, PF keys)
  - style.css   : amber CRT look (scanlines, glow, flicker, vignette)
  - content.js  : ALL site content (profile, resume text, projects,
                  blogs, videos, games). Edit this to add content.
  - wireframe.js: rotating 3D wireframe robot on the main menu
  - ship.js     : STATUS screen ship schematic (damage map)
  - areas.js    : scenes for each ship area (bridge console, ...)
  - cube.js     : Hex Cube puzzle (one side at a time, clickable squares)
  - hangman.js  : Hangman with a robot (words in content.js)
  - github.js   : live GitHub feed on the MASTER page (cached 10 min)
  - script.js   : the terminal engine (boot sequence, menus, commands)
  - resume.html : full resume PDF viewer
  - legacy-xp/  : backup of the previous Windows XP-style site

  CACHE NOTE: the ?v=51 on the CSS/JS links below forces browsers to
  load fresh copies. Bump the number whenever you change those files.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexisOS // Cogitator Terminal</title>
  <meta name="description" content="Alexis Gonzalez: Junior Software Engineer, backend focus. Portfolio, troubleshooting logs, projects, and resume." />
  <link rel="icon" href="images/robot-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/robot-icon.png" type="image/png" sizes="64x64" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css?v=51" />
</head>
<body>
  <div id="crt">


    <!-- Page keys across the top, like the function-key row on a flight console.
         data-page marks which page each key lights up on. -->
    <nav id="fkeys" aria-label="Pages">
      <button type="button" data-cmd="menu"     data-page="master"><b>F1</b>MASTER</button>
      <button type="button" data-cmd="about"    data-page="dossier"><b>F2</b>DOSSIER</button>
      <button type="button" data-cmd="projects" data-page="records"><b>F3</b>RECORDS</button>
      <button type="button" data-cmd="blog"     data-page="logs"><b>F4</b>LOGS</button>
      <button type="button" data-cmd="videos"   data-page="pict"><b>F5</b>PICT</button>
      <button type="button" data-cmd="games"    data-page="sim"><b>F6</b>SIM</button>
      <button type="button" data-cmd="resume"   data-page="service"><b>F7</b>SERVICE</button>
      <button type="button" data-cmd="contact"  data-page="vox"><b>F8</b>VOX</button>
      <button type="button" data-cmd="status"   data-page="status"><b>F9</b>STATUS</button>
      <button type="button" data-cmd="help"     data-page="help"><b>F10</b>HELP</button>
      <button type="button" data-cmd="back"     data-page="back"><b>ESC</b>BACK</button>
    </nav>

    <!-- Main screen: scrollback output + command prompt -->
    <main id="screen">
      <div id="output" aria-live="polite"></div>
      <form id="prompt-line" autocomplete="off">
        <label for="cmd" id="prompt">+++ VISITOR@VIGIL 7 &gt;</label>
        <input id="cmd" type="text" spellcheck="false" autocapitalize="off"
               autocomplete="off" aria-label="Terminal command" />
      </form>
    </main>

    <!-- Bottom status line (the rotating ship messages) -->
    <div id="statusline"><span class="dim">RECEIVING</span> <span class="sb-ticker" id="ticker" aria-hidden="true"></span></div>

    <!-- Info bar along the bottom, laid out like a mission-control monitor:
         node id on the left, current page in the middle, clock on the right. -->
    <footer id="statusbar">
      <div class="tb-row">
        <span class="sb-left"><span class="brand">ALEXIS</span><span class="brand-sep">//</span><span class="brand">OS</span> <span class="dim">v2.1</span></span>
        <span class="tb-title" id="pagetitle">BOOT</span>
        <span class="sb-right" id="clock">00:00</span>
      </div>
    </footer>


  </div>

  <!-- servitor 3-kappa maintenance key (b64): RkxBR3t2MWcxbF8wZl80NWhfczB1cmMzX3IzNGQzcn0= -->

  <noscript>
    <p style="color:#ffb000;background:#0a0703;padding:20px;font-family:monospace">
      This terminal requires JavaScript. Alexis Gonzalez, Junior Software
      Engineer. Email: me@argonzalez.com. GitHub: github.com/Knucme.
      LinkedIn: linkedin.com/in/a-gonzo.
    </p>
  </noscript>

  <script src="content.js?v=51"></script>
  <script src="wireframe.js?v=51"></script>
  <script src="ship.js?v=51"></script>
  <script src="areas.js?v=51"></script>
  <script src="cube.js?v=51"></script>
  <script src="hangman.js?v=51"></script>
  <script src="github.js?v=51"></script>
  <script src="script.js?v=51"></script>
  <script src="eggs.js?v=51"></script>
</body>
</html>
