<!DOCTYPE html>
<!--
  AlexisOS // Cogitator Terminal
  Personal portfolio of Alexis Gonzalez, presented as a terminal on a
  derelict ship. Plain HTML, CSS, and JavaScript. No frameworks.

  FILES
  - index.html  : the terminal shell (status bar, screen, prompt, PF keys)
  - style.css   : amber CRT look (scanlines, glow, flicker, vignette)
  - content.js  : ALL site content (profile, resume text, projects,
                  blogs, videos, games). Edit this to add content.
  - cube.js     : Hex Cube puzzle (one side at a time, clickable squares)
  - hangman.js  : Hangman with a robot (words in content.js)
  - script.js   : the terminal engine (boot sequence, menus, commands)
  - resume.html : full resume PDF viewer
  - legacy-xp/  : backup of the previous Windows XP-style site

  CACHE NOTE: the ?v=10 on the CSS/JS links below forces browsers to
  load fresh copies. Bump the number whenever you change those files.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexisOS // Cogitator Terminal</title>
  <meta name="description" content="Alexis Gonzalez: Junior Software Engineer, backend focus. Portfolio, troubleshooting logs, projects, and resume." />
  <link rel="icon" href="images/robot-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/robot-icon.png" type="image/png" sizes="64x64" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div id="crt">

    <!-- Status bar, styled after the status lines on old DEC/IBM terminals -->
    <header id="statusbar">
      <span class="sb-left">ALEXIS//OS <span class="dim">v2.0</span></span>
      <span class="sb-ticker" id="ticker" aria-hidden="true"></span>
      <span class="sb-right" id="clock">--:--</span>
    </header>

    <!-- Main screen: scrollback output + command prompt -->
    <main id="screen">
      <div id="output" aria-live="polite"></div>
      <form id="prompt-line" autocomplete="off">
        <label for="cmd" id="prompt">+++ VISITOR@VIGIL-7 &gt;</label>
        <input id="cmd" type="text" spellcheck="false" autocapitalize="off"
               autocomplete="off" aria-label="Terminal command" />
      </form>
    </main>

    <!-- Program function keys, after the PF key row on IBM 3270 terminals -->
    <nav id="fkeys" aria-label="Quick commands">
      <button type="button" data-cmd="help"><b>PF1</b>HELP</button>
      <button type="button" data-cmd="menu"><b>PF2</b>MENU</button>
      <button type="button" data-cmd="back"><b>PF3</b>BACK</button>
      <button type="button" data-cmd="blog"><b>PF4</b>LOGS</button>
      <button type="button" data-cmd="projects"><b>PF5</b>PROJECTS</button>
      <button type="button" data-cmd="videos"><b>PF6</b>VIDEOS</button>
      <button type="button" data-cmd="games"><b>PF7</b>GAMES</button>
      <button type="button" data-cmd="resume"><b>PF8</b>RESUME</button>
      <button type="button" data-cmd="contact"><b>PF9</b>CONTACT</button>
    </nav>

  </div>

  <!-- servitor 3-kappa maintenance key (b64): RkxBR3t2MWcxbF8wZl80NWhfczB1cmMzX3IzNGQzcn0= -->

  <noscript>
    <p style="color:#ffb000;background:#0a0703;padding:20px;font-family:monospace">
      This terminal requires JavaScript. Alexis Gonzalez, Junior Software
      Engineer. Email: me@argonzalez.com. GitHub: github.com/Knucme.
      LinkedIn: linkedin.com/in/a-gonzo.
    </p>
  </noscript>

  <script src="content.js?v=10"></script>
  <script src="cube.js?v=10"></script>
  <script src="hangman.js?v=10"></script>
  <script src="script.js?v=10"></script>
  <script src="eggs.js?v=10"></script>
</body>
</html>
