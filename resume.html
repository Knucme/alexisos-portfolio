<!DOCTYPE html>
<!--
  Resume page for AlexisOS (amber terminal theme).
  Opened from the SERVICE RECORD screen in the terminal.

  Save the resume PDF at:  resume/Alexis-Gonzalez-Resume.pdf
  To use a different filename, update the <object data="..."> below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Record // Alexis Gonzalez</title>
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --amber: #ffb000;
      --amber-dim: #a86f00;
      --amber-faint: #3d2a00;
      --bg: #0a0703;
      --glow: 0 0 2px rgba(255, 176, 0, 0.75), 0 0 9px rgba(255, 140, 0, 0.32);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--amber);
      font-family: "VT323", "Courier New", monospace;
      text-shadow: var(--glow);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 18px;
      border-bottom: 1px solid var(--amber-faint);
      background: rgba(255, 176, 0, 0.05);
      font-size: 20px;
      letter-spacing: 0.05em;
    }
    header a {
      color: var(--amber);
      text-decoration: none;
      border: 1px solid var(--amber-dim);
      padding: 2px 10px;
    }
    header a:hover { background: var(--amber); color: var(--bg); text-shadow: none; }
    .pdf-viewer { flex: 1; width: 100%; border: 0; background: #222; }
    .missing {
      max-width: 640px;
      margin: 48px auto;
      padding: 18px 24px;
      border: 3px double var(--amber-dim);
      font-size: 21px;
      line-height: 1.35;
    }
    .missing h2 { margin-top: 0; font-weight: normal; letter-spacing: 0.06em; }
    .missing code { color: var(--bg); background: var(--amber-dim); padding: 0 6px; text-shadow: none; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <span>&gt;&gt; SERVICE RECORD // ALEXIS GONZALEZ</span>
    <a href="index.html">&larr; RETURN TO TERMINAL</a>
  </header>

  <!-- If the PDF is missing or can't render inline, the fallback shows. -->
  <object class="pdf-viewer" data="resume/Alexis-Gonzalez-Resume.pdf" type="application/pdf">
    <div class="missing">
      <h2>+++ SERVICE RECORD NOT YET UPLOADED +++</h2>
      <p>The full record will appear here once the file is added at:</p>
      <p><code>resume/Alexis-Gonzalez-Resume.pdf</code></p>
      <p>A text version is available in the terminal under SERVICE RECORD.</p>
    </div>
  </object>
</body>
</html>
